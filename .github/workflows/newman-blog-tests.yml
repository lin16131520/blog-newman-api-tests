name: Newman Blog API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  blog-api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --legacy-peer-deps

      - run: npx newman run collection.json -e environment.json -d userId.csv -r cli,htmlextra --reporter-htmlextra-export report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-report
          path: report.html
